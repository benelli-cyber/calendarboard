<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-dark">
  <main class="dashboard">

    <!-- 1. Header: clock + date (left), current weather (right) -->
    <header class="header">
      <div class="clock-block">
        <div class="clock"><span id="clock-time">--:--</span><span id="clock-ampm" class="ampm"></span></div>
        <div id="clock-date" class="date"></div>
      </div>
      <!-- Current weather: icon + temp, then feels-like/high/low, then conditions/precip -->
      <div id="current-weather" class="current-weather" hidden>
        <div class="cw-top">
          <img id="cw-icon" class="cw-icon" alt="">
          <span id="cw-temp" class="cw-temp"></span>
        </div>
        <div id="cw-line1" class="cw-line"></div>
        <div class="cw-line">
          <span id="cw-condition" class="cw-condition"></span>
          <span id="cw-precip" class="cw-precip" hidden><img src="icons/drop.svg" alt=""><span></span></span>
        </div>
      </div>
      <div id="weather-message" class="weather-message" hidden></div>
    </header>

    <!-- 2. Weather alert banner (hidden unless an NWS alert is active) -->
    <div id="alert-banner" class="alert-banner" hidden></div>

    <!-- 3. Calendar: month grid or Sun–Sat week (display.calendarView) -->
    <section class="panel calendar">
      <div class="cal-header">
        <h2 id="cal-title" class="cal-title"></h2>
        <div id="calendar-stale" class="stale" hidden></div>
      </div>
      <div id="cal-weekdays" class="cal-weekdays"></div>
      <div id="cal-grid" class="cal-grid"></div>
    </section>

    <!-- 4 + 5. Bottom row: forecast (left) and to-do list (right), side by side -->
    <div class="bottom-row">
      <!-- 5-day forecast strip -->
      <section class="panel forecast">
        <div id="forecast-days" class="forecast-days"></div>
        <div id="weather-stale" class="weather-stale" hidden></div>
      </section>

      <!-- Shared to-do list (edit on phones at /todo); sized for about 4 items -->
      <section class="panel todos">
        <h2 class="section-title">To-Do</h2>
        <ul id="todo-list" class="todo-list"></ul>
      </section>
    </div>

  </main>

  <!-- Night dimming: a plain black layer over everything (display.dimEnabled) -->
  <div id="dim-overlay" class="dim-overlay" hidden></div>

  <!-- Month/week switch. Saved on the server, so clicking it from a phone or
       computer on the LAN also switches the Pi's screen within ~15 seconds. -->
  <div class="view-toggle" role="group" aria-label="Calendar view">
    <button type="button" data-view="month">Month</button>
    <button type="button" data-view="week">Week</button>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
